[project]
name = "java-agent-lab"
version = "0.1.0"
description = "Java 开发者补齐 Python + Agent 技术栈的 30 天学习仓库（2026-11-13 ~ 2026-12-12）"
readme = "README.md"
authors = [
    { name = "chayu", email = "3317038611@qq.com" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]
docs = [
    "markdown-it-py>=4.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# 笔记里的代码围栏是给人看的示例，按讲解需要排版，不交给 formatter 重排
extend-exclude = ["notes"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# RUF001/2/3 会把中文注释里的全角标点判为「易混淆字符」，本项目注释以中文为主，属误报
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
# 不写 testpaths：从仓库根自动收集，新的一天加了测试不需要改配置
asyncio_mode = "auto"
addopts = "-ra"
