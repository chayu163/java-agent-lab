services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: rag_lab
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent_dev_only
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d rag_lab"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgvector_data:
