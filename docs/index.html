<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Agent 工程 · 学习路径</title>
<meta name="description" content="Java 开发者补齐 Python + Agent 技术栈的 30 天路径图：节点对应笔记与代码。">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <div class="brand-text">
      <h1>AI Agent 工程 · 学习路径</h1>
      <p class="brand-sub">2026-11-13 → 2026-12-12 · 每日 6-8h · 目标 杭沪 Agent 岗 15-30K</p>
    </div>
  </div>
  <div class="topbar-actions">
    <div class="stat" id="stat-progress" title="已有产出的天数 / 总天数">
      <span class="stat-num">–</span><span class="stat-label">天已产出</span>
    </div>
    <button class="btn" id="btn-research" type="button">
      <span aria-hidden="true">▤</span> 调研与计划
    </button>
    <button class="btn btn-icon" id="btn-theme" type="button" title="切换主题" aria-label="切换主题">◐</button>
  </div>
</header>

<main class="stage">
  <div class="stage-head">
    <p class="stage-hint">点击任意节点，查看它对应的笔记与代码</p>
    <div class="legend" id="legend"></div>
  </div>
  <div class="roadmap" id="roadmap"></div>

  <section class="stops">
    <h2 class="stops-title">止损线</h2>
    <p class="stops-sub">到点没达标就砍范围，不追进度、不带病往下走。</p>
    <ul class="stop-list" id="stop-list"></ul>
  </section>
</main>

<aside class="drawer" id="drawer" aria-hidden="true" aria-label="节点详情">
  <div class="drawer-scroll">
    <header class="drawer-head">
      <button class="drawer-close" id="drawer-close" type="button" aria-label="关闭">✕</button>
      <p class="drawer-kicker" id="drawer-kicker"></p>
      <h2 class="drawer-title" id="drawer-title"></h2>
      <p class="drawer-lead" id="drawer-lead"></p>
      <div class="drawer-tags" id="drawer-tags"></div>
    </header>
    <nav class="tabs" id="tabs" role="tablist">
      <button class="tab is-active" data-tab="overview" type="button" role="tab">概览</button>
      <button class="tab" data-tab="notes" type="button" role="tab">笔记 <span class="tab-count" id="count-notes">0</span></button>
      <button class="tab" data-tab="code" type="button" role="tab">代码 <span class="tab-count" id="count-code">0</span></button>
    </nav>
    <div class="panels">
      <section class="panel is-active" data-panel="overview" id="panel-overview"></section>
      <section class="panel" data-panel="notes" id="panel-notes"></section>
      <section class="panel" data-panel="code" id="panel-code"></section>
    </div>
  </div>
</aside>

<div class="scrim" id="scrim"></div>

<div class="modal" id="modal" aria-hidden="true" role="dialog" aria-label="调研与计划">
  <div class="modal-box">
    <header class="modal-head">
      <h2>调研与计划</h2>
      <button class="drawer-close" id="modal-close" type="button" aria-label="关闭">✕</button>
    </header>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<footer class="footer">
  <span>java-agent-lab · 内容随仓库自动更新</span>
  <span id="build-stamp"></span>
</footer>

<script src="assets/roadmap-data.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
