name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        # build_site.py 依赖 docs 组里的 markdown-it-py，不带 --group docs 会 import-not-found
        run: uv run --group docs mypy .

      - name: Build site content
        run: uv run --group docs python tools/build_site.py
